<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=t42, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        button{
            font-size:30px;
            margin-right: 60px;
            margin-top: 20px;
            padding: 15px;
            background-color: aquamarine;
            border: none;
            outline: none;
            border-radius: 15px;
        }
        #h1:hover{
            outline: 3px solid blue;
            border-radius: 25px 0 25px 0;
        }
        button:hover
        {
            cursor:pointer ;
            background-color: black;
            color:antiquewhite;
        }
    </style>
</head>
<body>
    <button id="h1"> home</button>
    <button id="h2"> view</button>
    <button id="h3"> show</button>
    <button id="h4"> contact us</button>

</body>
</html>
