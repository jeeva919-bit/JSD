<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        #header1
        {
           color:red;
        }
        #header3
        {
            color:green;
        }
    #header3
    {
        color:blue;
    }
</style>
</head>
<body>
    <h2> id attribute: we can apply different styles for each element</h2>
    <h1 id="header1">this is header 1 red</h1>
    <h1 id="header2">this is header 2 green</h1>
    <h1 id="header3">this is header 3 blue</h1>
</body>
</html>
